# =============================================================================
#  Local LLM Stack — RTX 3060 (12GB VRAM) — Ubuntu/Debian
#  3 services: ollama (GPU) · searxng (private search) · api (RAG + UI)
#  Open in browser: http://localhost:8030
# =============================================================================

services:

  # ── Ollama: GPU inference engine ─────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports: ["11434:11434"]
    volumes: [ollama_models:/root/.ollama]
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_HOST=http://0.0.0.0:11434
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # ── SearXNG: private self-hosted search ──────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports: ["8025:8080"]
    volumes:
      - searxng_data:/etc/searxng
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8025
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-change-this-secret-key-please}
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── API + UI: FastAPI + embedded ChromaDB; serves the SPA at / ──────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: llm-api
    restart: unless-stopped
    ports: ["8030:8030"]
    environment:
      # Ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - DEFAULT_MODEL=${DEFAULT_MODEL:-mistral:7b-instruct-q4_K_M}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      # API
      - API_KEY=${API_KEY:-change-me-in-production}
      - MAX_TOKENS=${MAX_TOKENS:-4096}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - DATA_DIR=/app/data
      # Memory / RAG
      - MEMORY_ENABLED=true
      - ANONYMIZED_TELEMETRY=FALSE
      - CHUNK_SIZE=800
      - CHUNK_OVERLAP=150
      - MEMORY_TOP_K=5
      # Web search
      - SEARCH_ENABLED=true
      - SEARCH_ALWAYS=false
      - SEARXNG_URL=http://searxng:8080
      - AUTO_SEARCH_THRESHOLD=0.35
      - SEARCH_RESULTS=5
      # Optional Firecrawl (host-side, leave default if not running)
      - FIRECRAWL_URL=${FIRECRAWL_URL:-http://host.docker.internal:3002}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-fc-local}
      # Optional X/Twitter (run `x-cli auth login` on host first)
      - X_SEARCH_ENABLED=${X_SEARCH_ENABLED:-false}
      - X_SEARCH_COUNT=10
      - X_CLI_PATH=/usr/local/bin/x-cli
      # Auxiliary sites (comma-separated, prepended on every web search)
      - AUXILIARY_SITES=${AUXILIARY_SITES:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_data:/app/data
      # Live-reload: edits to api/*.py and api/static/* take effect without rebuild
      - ./api:/app
      # x-cli credentials (only needed if X_SEARCH_ENABLED=true)
      - ${HOME}/.x-cli:/root/.x-cli:ro
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8030", "--reload"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_models:
  searxng_data:
  app_data:

networks:
  default:
    name: llm-network
    driver: bridge
