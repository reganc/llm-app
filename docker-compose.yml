# =============================================================================
#  Local LLM Stack — RTX 3060 (12GB VRAM) — Ubuntu/Debian
#  4 services: ollama (GPU) · searxng (search) · db (postgres+pgvector) · api
#  Open in browser: http://localhost:8030
# =============================================================================

services:

  # ── Ollama: GPU inference engine ─────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    labels:
      autoheal: "true"
    ports: ["11434:11434"]
    volumes: [ollama_models:/root/.ollama]
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=3
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_HOST=http://0.0.0.0:11434
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # ── SearXNG: private self-hosted search ──────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    labels:
      autoheal: "true"
    ports: ["8025:8080"]
    volumes:
      - searxng_data:/etc/searxng
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8025
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-change-this-secret-key-please}
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Postgres + pgvector: RAG metadata + vector store ────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: llm-db
    restart: unless-stopped
    labels:
      autoheal: "true"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-llm}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-llm}
      - POSTGRES_DB=${POSTGRES_DB:-llmrag}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports: ["5433:5432"]  # host:container — host port shifted to avoid clashing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llm} -d ${POSTGRES_DB:-llmrag}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ── API + UI: FastAPI + Postgres-backed RAG; serves the SPA at / ────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: llm-api
    restart: unless-stopped
    labels:
      autoheal: "true"
    ports: ["8030:8030"]
    environment:
      # Ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - DEFAULT_MODEL=${DEFAULT_MODEL:-huihui_ai/qwen2.5-abliterate:14b}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      # API
      - API_KEY=${API_KEY:-change-me-in-production}
      - MAX_TOKENS=${MAX_TOKENS:-4096}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # Per-IP rate limiting (important once exposed via Tailscale Funnel)
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT=${RATE_LIMIT:-120/minute}
      - DATA_DIR=/app/data
      # Memory / RAG (postgres + pgvector)
      - MEMORY_ENABLED=true
      # Pinned (not ${DATABASE_URL:-...}): this DSN targets the internal `db`
      # service and must never inherit a stray ambient DATABASE_URL from the
      # shell that launched compose.
      - DATABASE_URL=postgresql://llm:llm@db:5432/llmrag
      - EMBED_DIM=${EMBED_DIM:-768}
      - CHUNK_SIZE=800
      - CHUNK_OVERLAP=150
      - MEMORY_TOP_K=5
      # Background schedulers
      #   Default mode is "window": run back-to-back batches inside the
      #   nightly [start, end] window until the backlog drains, then idle
      #   until the next window. Defaults to 23:00→06:00 Central.
      #   To revert to once-a-day cron, set REFINE_WINDOW_START="" (or
      #   _END="") and the loop falls back to REFINE_AT. Same for distill.
      - REFINE_WINDOW_START=${REFINE_WINDOW_START:-23:00}
      - REFINE_WINDOW_END=${REFINE_WINDOW_END:-06:00}
      - REFINE_BATCH_PAUSE_S=${REFINE_BATCH_PAUSE_S:-30}
      - REFINE_AT=${REFINE_AT:-02:00}
      - REFINE_TIMEZONE=${REFINE_TIMEZONE:-America/Chicago}
      - REFINE_PER_RUN=${REFINE_PER_RUN:-30}
      - DISTILL_WINDOW_START=${DISTILL_WINDOW_START:-23:00}
      - DISTILL_WINDOW_END=${DISTILL_WINDOW_END:-06:00}
      - DISTILL_BATCH_PAUSE_S=${DISTILL_BATCH_PAUSE_S:-30}
      - DISTILL_AT=${DISTILL_AT:-03:00}
      - DISTILL_TIMEZONE=${DISTILL_TIMEZONE:-America/Chicago}
      # Web search
      - SEARCH_ENABLED=true
      - SEARCH_ALWAYS=false
      - SEARXNG_URL=http://searxng:8080
      - AUTO_SEARCH_THRESHOLD=0.35
      - SEARCH_RESULTS=5
      # Optional Firecrawl (host-side, leave default if not running)
      - FIRECRAWL_URL=${FIRECRAWL_URL:-http://host.docker.internal:3002}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-fc-local}
      # Optional X/Twitter (run `x-cli auth login` on host first)
      - X_SEARCH_ENABLED=${X_SEARCH_ENABLED:-false}
      - X_SEARCH_COUNT=10
      - X_CLI_PATH=/usr/local/bin/x-cli
      # Auxiliary sites (comma-separated, prepended on every web search)
      - AUXILIARY_SITES=${AUXILIARY_SITES:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_data:/app/data
      # Live-reload: edits to api/*.py and api/static/* take effect without rebuild
      - ./api:/app
      # x-cli credentials (only needed if X_SEARCH_ENABLED=true)
      - ${HOME}/.x-cli:/root/.x-cli:ro
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8030", "--reload"]
    depends_on:
      ollama:
        condition: service_healthy
      db:
        condition: service_healthy

volumes:
  ollama_models:
  searxng_data:
  app_data:
  db_data:

networks:
  default:
    name: llm-network
    driver: bridge
